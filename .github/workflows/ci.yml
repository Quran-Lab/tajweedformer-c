name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Engine submodule
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-engine.sh vendor/zipformer-sdk
      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress
      - name: Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libssl-dev
      - name: Build
        run: |
          X=""; if [ "$RUNNER_OS" = Windows ]; then X="-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $X
          cmake --build build
      - name: Kernels against the engine
        run: ctest --test-dir build -V --output-on-failure
      - name: The README's quick start is examples/quickstart.c (which the build above compiled)
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          $PY test/quickstart_check.py
      - name: The README's compile line (Linux), and the program starts
        if: runner.os == 'Linux'
        run: |
          cc examples/quickstart.c -I include -I vendor/zipformer-sdk/tajweed/include -L build -ltajweedformer -o quickstart_readme
          code=0; LD_LIBRARY_PATH=build ./quickstart_readme || code=$?
          # without a key it prints its usage and exits 2: it linked, and the library loaded
          [ "$code" -eq 2 ] || { echo "::error::quickstart_readme exited $code, 2 expected"; exit 1; }
